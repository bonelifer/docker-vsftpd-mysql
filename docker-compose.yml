version: '3'
services:
  vsftpd:
    image: ghcr.io/bonelifer/docker-vsftpd-mysql:latest
    container_name: vsftpd
    restart: always
    network_mode: "host"
    depends_on:
      - mariadb
    environment:
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_HOST=127.0.0.1
      - MYSQL_DATABASE=database
      - MYSQL_TABLE=users
      - MYSQL_USER_COLUMN=name
      - MYSQL_PASSWD_COLUMN=password
      - MYSQL_PASSWD_CRYPT=1
      - LISTEN_PORT=21
      - PASV_ENABLE=YES
      - PASV_ADDRESS=
      - PASV_MIN_PORT=0
      - PASV_MAX_PORT=0
    volumes:
      - /var/ftp:/home

  mariadb:
    image: mariadb:11.4.12
    container_name: vsftpd-mariadb
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      # Change this for anything beyond local testing.
      - MARIADB_ROOT_PASSWORD=changeme
      - MARIADB_DATABASE=database
      - MARIADB_USER=user
      - MARIADB_PASSWORD=password
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro

volumes:
  mariadb-data:
